<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6fff"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6fff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Hexagon background -->
  <polygon
    points="100,8 182,54 182,146 100,192 18,146 18,54"
    fill="url(#fill)"
    stroke="url(#grad)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Sharp N: two vertical bars + diagonal slash -->
  <!-- Left bar -->
  <rect x="52" y="58" width="18" height="84" rx="4" fill="url(#grad)" filter="url(#glow)"/>
  <!-- Right bar -->
  <rect x="130" y="58" width="18" height="84" rx="4" fill="url(#grad)" filter="url(#glow)"/>
  <!-- Diagonal stroke (top-left to bottom-right) -->
  <path
    d="M70 62 L130 138"
    stroke="url(#grad)"
    stroke-width="18"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Top-right accent dot -->
  <circle cx="160" cy="44" r="6" fill="#ff6b35" opacity="0.9"/>
  <!-- Bottom-left accent dot -->
  <circle cx="40" cy="156" r="6" fill="#7c6fff" opacity="0.9"/>
</svg>

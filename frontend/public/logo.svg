<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6fff"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6fff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="94" fill="url(#g2)"/>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="94" stroke="url(#g1)" stroke-width="3"/>
  <!-- Inner hexagon -->
  <polygon points="100,36 156,68 156,132 100,164 44,132 44,68"
    stroke="url(#g1)" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- N letterform -->
  <path d="M65 135 L65 65 L100 115 L135 65 L135 135"
    stroke="url(#g1)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
    fill="none" filter="url(#glow)"/>
  <!-- Corner accent dots -->
  <circle cx="100" cy="14" r="4.5" fill="#7c6fff"/>
  <circle cx="100" cy="186" r="4.5" fill="#ff6b35"/>
  <circle cx="14"  cy="100" r="3"   fill="#7c6fff" opacity="0.5"/>
  <circle cx="186" cy="100" r="3"   fill="#ff6b35" opacity="0.5"/>
</svg>
